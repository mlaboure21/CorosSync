name: CorosSync
version: "0.4.0"
slug: corossync
description: Pull your COROS watch data into local storage and Home Assistant
arch: [aarch64, amd64]
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:run
panel_title: COROS
startup: application
boot: auto
map:
  - share:rw
services:
  - mqtt:want
options:
  email: ""
  password: ""
  region: eu
  sync_interval_hours: 6
  backfill: true
  download_fit: true
schema:
  email: email
  password: password
  region: list(eu|global)
  sync_interval_hours: float(0.5,48)
  backfill: bool
  download_fit: bool
